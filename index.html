function webLink(q){ return "https://map.naver.com/p/search/" + encodeURIComponent(q); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

var KINDS = ["일반","양많이","특양많이","스페셜","샐러드","바트"];
var LABEL = {"많이":"양많이","밑반/샐러드":"샐러드"};
var DB = "https://baesong-5ac3f-default-rtdb.asia-southeast1.firebasedatabase.app";
function todayKey(){ return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10).replace(/-/g,""); }
var DAY = todayKey();
var BASE = DB + "/baesong/" + DAY;
var STORE = "baesong-counts-" + DAY;
var counts = {};
try { counts = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch(e) { counts = {}; }
var SEED = {
 "연수오케이정형외과":{"스페셜":10},
 "메가커피 인천동춘점":{"일반":3},
 "연희동물의료센터":{"일반":11},
 "양지온누리약국":{"양많이":1},
 "도림동 공사현장":{"양많이":9},
 "자연놀이학교 루시어린이집":{"일반":2},
 "서창내과":{"일반":5},
 "신세기안경원 (서창내과 건물)":{"일반":2},
 "청선학교":{"양많이":27},
 "더베스트정형외과":{"일반":9,"양많이":9},
 "지원":{"스페셜":4},
 "slp 어학원":{"바트":1},
 "기사님 식사":{"일반":1}
};
function save(){ try { localStorage.setItem(STORE, JSON.stringify(counts)); } catch(e) {} }
var OPTS = '<option value="">-</option>';
for (var n = 1; n <= 50; n++) OPTS += '<option value="'+n+'">'+n+'</option>';

function payBlock(d){
  var cur = counts[d.n] || {};
  var a = cur._amt ? String(cur._amt).replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "";
  var h = '<div class="pay"><span>결제금액</span><input type="text" inputmode="numeric" class="amt'+(a?' on':'')+'" data-name="'+esc(d.n)+'" value="'+a+'" placeholder="0" aria-label="'+esc(d.n)+' 결제금액"><em>원</em><button type="button" class="paid'+(cur._paid?' on':'')+'" data-paid="1" data-name="'+esc(d.n)+'" aria-pressed="'+(cur._paid?'true':'false')+'">결제완료</button></div>';
  return h;
}

function countBlock(d){
  var cur = counts[d.n] || {};
  var h = '<p class="cnt-t">배송 수량</p><div class="cnt">';
  KINDS.forEach(function(k){
    var v = cur[k] || "";
    var o = OPTS.replace('value="'+v+'"', 'value="'+v+'" selected');
    h += '<label>'+k+'<select data-name="'+esc(d.n)+'" data-kind="'+k+'" class="'+(v?'on':'')+'" aria-label="'+esc(d.n)+' '+k+' 수량">'+o+'</select></label>';
  });
  h += '</div>';
  h += '<div class="pk" role="group" aria-label="수거 여부"><button type="button" data-pk="1" data-name="'+esc(d.n)+'" class="'+(cur._pk===1?'on1':'')+'">수거완료</button><button type="button" data-pk="2" data-name="'+esc(d.n)+'" class="'+(cur._pk===2?'on2':'')+'">미수거</button></div>';
  return h;
}

function renderSum(armed){
  var tot = {}, any = false, amt = 0, p1 = 0, p2 = 0, pd = 0;
  Object.keys(counts).forEach(function(nm){
    var c = counts[nm] || {};
    KINDS.forEach(function(k){ var v = +c[k]||0; if (v){ tot[k]=(tot[k]||0)+v; any = true; } });
    if (+c._amt) { amt += +c._amt; any = true; }
    if (c._paid) { pd++; any = true; }
    if (c._pk === 1) { p1++; any = true; } else if (c._pk === 2) { p2++; any = true; }
  });
  var h = '<span>합계</span>';
  if (any) KINDS.forEach(function(k){ if (tot[k]) h += '<span class="chip">'+k+' <b>'+tot[k]+'</b></span>'; });
  if (amt) h += '<span class="chip">결제 <b>'+String(amt).replace(/\B(?=(\d{3})+(?!\d))/g, ",")+'원</b></span>';
  if (pd) h += '<span class="chip">결제완료 <b>'+pd+'</b>곳</span>';
  if (p1 || p2) h += '<span class="chip">수거완료 <b>'+p1+'</b> · 미수거 <b>'+p2+'</b></span>';
  if (!any) h += '<span>선택 없음</span>';
  if (any) h += '<button type="button" class="rst" id="rst">'+(armed?'한 번 더 누르면 초기화':'전체 초기화')+'</button>';
  document.getElementById("sum").innerHTML = h;
}

function card(d){
  var h = '<article class="card"><div class="head">'+(d.no?'<span class="no" aria-label="번호 '+d.no+'">'+d.no+'</span>':'')+'<h3 class="name">'+esc(d.n)+'</h3>'+(d.time?'<span class="time">'+esc(d.time)+'</span>':'')+'</div>' + payBlock(d);
  var chips = [];
  if (d.pick) chips.push('<span class="chip pick">'+esc(d.pick)+'</span>');
  if (d.day) chips.push('<span class="chip">주문 '+esc(d.day)+'</span>');
  if (d.pay) chips.push('<span class="chip">'+esc(d.pay)+'</span>');
  if (chips.length) h += '<div class="meta">'+chips.join("")+'</div>';
  h += '<p class="addr">'+esc(d.a)+'</p>';
  if (d.note) h += '<p class="note">'+esc(d.note)+'</p>';
  if (d.tel) h += '<p class="addr">전화 '+esc(d.tel)+'</p>';
  h += countBlock(d);
  if (d.q) {
    h += '<div class="acts"><a class="btn go" href="'+esc(appLink(d.q))+'">네이버지도 길안내</a>'+
         '<a class="btn sub" href="'+esc(webLink(d.q))+'" target="_blank" rel="noopener">웹지도</a></div>';
  } else {
    h += '<p class="none">길안내 없음</p>';
  }
  return h + '</article>';
}

function render(){
  var term = document.getElementById("q").value.trim().toLowerCase();
  var rows = DATA.filter(function(d){ return !term || (d.n+" "+d.a).toLowerCase().indexOf(term) >= 0; });
  document.getElementById("count").textContent = rows.length + "곳";
  var out = "";
  var routed = rows.filter(function(d){return d.no;}).sort(function(a,b){return a.no-b.no || DATA.indexOf(a)-DATA.indexOf(b);});
  var rest = rows.filter(function(d){return !d.no;});
  [["오늘 배송 순서", routed], ["오늘 순서에 없는 곳", rest]].forEach(function(sec){
    if (!sec[1].length) return;
    out += '<h2>'+sec[0]+' · '+sec[1].length+'곳</h2><div class="list">'+sec[1].map(card).join("")+'</div>';
  });
  document.getElementById("app").innerHTML = out || '<p class="empty">검색 결과가 없습니다.</p>';
  renderSum(false);
}


/* ---- 실시간 공유 (Firebase Realtime Database, REST) ---- */
function ek(nm){ return encodeURIComponent(nm).replace(/\./g,"%2E"); }
var NAMES = {}; DATA.forEach(function(d){ NAMES[ek(d.n)] = d.n; });
var root = null, gotFirst = false;
var syncEl = document.createElement("p");
syncEl.id = "sync"; syncEl.style.cssText = "margin:6px 16px 0;font-size:12px;color:var(--muted)";
document.getElementById("app").parentNode.insertBefore(syncEl, document.getElementById("app"));
function setSync(ok, msg){ syncEl.textContent = (ok ? "● " : "○ ") + msg; syncEl.style.color = ok ? "var(--accent)" : "var(--muted)"; }
setSync(false, "연결 중…");

function refreshSelects(){
  var list = document.querySelectorAll("select[data-kind]");
  for (var i = 0; i < list.length; i++) {
    var s = list[i];
    var v = ((counts[s.getAttribute("data-name")] || {})[s.getAttribute("data-kind")]) || "";
    if (String(s.value) !== String(v)) s.value = String(v);
    s.className = v ? "on" : "";
  }
  var inp = document.querySelectorAll("input.amt");
  for (var j = 0; j < inp.length; j++) {
    var x = inp[j]; if (document.activeElement === x) continue;
    var a = (counts[x.getAttribute("data-name")] || {})._amt || "";
    x.value = a ? String(a).replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "";
    x.className = "amt" + (a ? " on" : "");
  }
  var pb = document.querySelectorAll("button[data-paid]");
  for (var q2 = 0; q2 < pb.length; q2++) {
    var on = !!(counts[pb[q2].getAttribute("data-name")] || {})._paid;
    pb[q2].className = "paid" + (on ? " on" : ""); pb[q2].setAttribute("aria-pressed", on ? "true" : "false");
  }
  var bt = document.querySelectorAll("button[data-pk]");
  for (var m = 0; m < bt.length; m++) {
    var b = bt[m], pk = (counts[b.getAttribute("data-name")] || {})._pk || 0, w = +b.getAttribute("data-pk");
    b.className = pk === w ? "on" + w : "";
  }
}
function applyRemote(){
  var rc = (root && root.counts) || {}, c = {};
  Object.keys(rc).forEach(function(k){
    var nm = NAMES[k]; if (!nm || !rc[k]) return;
    var o = {}; KINDS.concat(['_amt','_pk','_paid']).forEach(function(kd){ var n = +rc[k][kd]; if (n) o[kd] = n; });
    if (Object.keys(o).length) c[nm] = o;
  });
  counts = c; save(); refreshSelects(); renderSum(false);
}
function setPath(path, data){
  if (path === "/" || path === "") { root = data; return; }
  var parts = path.split("/").filter(Boolean);
  if (root === null || typeof root !== "object") root = {};
  var o = root;
  for (var i = 0; i < parts.length - 1; i++) {
    if (o[parts[i]] === null || typeof o[parts[i]] !== "object" || o[parts[i]] === undefined) o[parts[i]] = {};
    o = o[parts[i]];
  }
  var last = parts[parts.length - 1];
  if (data === null) delete o[last]; else o[last] = data;
}
function seedRemote(){
  var enc = {};
  Object.keys(SEED).forEach(function(nm){ enc[ek(nm)] = SEED[nm]; });
  root = { seeded: true, counts: enc };
  fetch(BASE + ".json", { method: "PUT", body: JSON.stringify(root) }).catch(function(){});
}
function onStream(ev){
  var m; try { m = JSON.parse(ev.data); } catch(e) { return; }
  if (!m) return;
  if (ev.type === "put") setPath(m.path, m.data);
  else if (ev.type === "patch") Object.keys(m.data || {}).forEach(function(k){ setPath((m.path === "/" ? "" : m.path) + "/" + k, m.data[k]); });
  if (!gotFirst) { gotFirst = true; if (root === null || !root.seeded) seedRemote(); }
  applyRemote();
  setSync(true, "실시간 공유 중 · 다른 폰의 변경이 바로 반영됩니다");
}
function startSync(){
  if (!window.EventSource) { setSync(false, "이 브라우저는 실시간 공유를 지원하지 않아 이 폰에만 저장됩니다"); return; }
  var es = new EventSource(BASE + ".json");
  es.addEventListener("put", onStream);
  es.addEventListener("patch", onStream);
  es.onerror = function(){
    setSync(false, "연결 끊김 · 이 폰에만 저장 중 (연결되면 자동으로 다시 공유)");
    if (!gotFirst && !Object.keys(counts).length) { counts = JSON.parse(JSON.stringify(SEED)); refreshSelects(); renderSum(false); }
  };
}
function push(nm, k, n){
  var url = BASE + "/counts/" + encodeURIComponent(ek(nm)) + "/" + encodeURIComponent(k) + ".json";
  var req = n ? fetch(url, { method: "PUT", body: JSON.stringify(n) }) : fetch(url, { method: "DELETE" });
  req.catch(function(){ setSync(false, "저장 실패 · 연결을 확인하세요"); });
}
document.addEventListener("visibilitychange", function(){ if (!document.hidden && todayKey() !== DAY) location.reload(); });
document.getElementById("q").addEventListener("input", render);
document.getElementById("app").addEventListener("change", function(ev){
  var s = ev.target.closest("select[data-kind]"); if (!s) return;
  var nm = s.getAttribute("data-name"), k = s.getAttribute("data-kind");
  counts[nm] = counts[nm] || {};
  if (s.value) counts[nm][k] = +s.value; else delete counts[nm][k];
  if (!Object.keys(counts[nm]).length) delete counts[nm];
  s.className = s.value ? "on" : "";
  save(); renderSum(false); push(nm, k, +s.value || 0);
});
document.getElementById("app").addEventListener("change", function(ev){
  var x = ev.target.closest("input.amt"); if (!x) return;
  var nm = x.getAttribute("data-name"), n = parseInt(x.value.replace(/[^0-9]/g, ""), 10) || 0;
  counts[nm] = counts[nm] || {};
  if (n) counts[nm]._amt = n; else delete counts[nm]._amt;
  if (!Object.keys(counts[nm]).length) delete counts[nm];
  x.value = n ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "";
  x.className = "amt" + (n ? " on" : "");
  save(); renderSum(false); push(nm, "_amt", n);
});
document.getElementById("app").addEventListener("click", function(ev){
  var pdb = ev.target.closest("button[data-paid]");
  if (pdb) {
    var pn = pdb.getAttribute("data-name");
    counts[pn] = counts[pn] || {};
    var pv = counts[pn]._paid ? 0 : 1;
    if (pv) counts[pn]._paid = 1; else delete counts[pn]._paid;
    if (!Object.keys(counts[pn]).length) delete counts[pn];
    save(); refreshSelects(); renderSum(false); push(pn, "_paid", pv);
    return;
  }
  var b = ev.target.closest("button[data-pk]"); if (!b) return;
  var nm = b.getAttribute("data-name"), w = +b.getAttribute("data-pk");
  counts[nm] = counts[nm] || {};
  var nv = counts[nm]._pk === w ? 0 : w;
  if (nv) counts[nm]._pk = nv; else delete counts[nm]._pk;
  if (!Object.keys(counts[nm]).length) delete counts[nm];
  save(); refreshSelects(); renderSum(false); push(nm, "_pk", nv);
});
var armed = false, armTimer = null;
document.getElementById("sum").addEventListener("click", function(ev){
  if (!ev.target.closest("#rst")) return;
  if (!armed) { armed = true; renderSum(true); armTimer = setTimeout(function(){ armed = false; renderSum(false); }, 3000); return; }
  clearTimeout(armTimer); armed = false; counts = {}; save(); render(); fetch(BASE + "/counts.json", { method: "DELETE" }).catch(function(){});
});
/* ---- 배송표 촬영 -> 수량 자동 입력 (/api/read-sheet) ---- */
var CODEKEY = "baesong-code", scanResult = null;
function shrink(file, cb){
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function(){
    var max = 2000, r = Math.min(1, max / Math.max(img.width, img.height));
    var c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); cb(c.toDataURL("image/jpeg", 0.85));
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}
function ovlShow(html, canApply){ document.getElementById("ovlBody").innerHTML = html; document.getElementById("ovlYes").hidden = !canApply; document.getElementById("ovl").hidden = false; }
function ovlHide(){ document.getElementById("ovl").hidden = true; scanResult = null; }
function scanCall(dataUrl, retry){
  var code = ""; try { code = localStorage.getItem(CODEKEY) || ""; } catch(e) {}
  return fetch("/api/read-sheet", { method: "POST", headers: { "content-type": "application/json", "x-access-code": code },
    body: JSON.stringify({ image: dataUrl, names: DATA.map(function(d){ return d.n; }) }) })
  .then(function(r){
    if (r.status === 401 && !retry) {
      var c = window.prompt("접속 코드를 입력하세요"); if (!c) throw new Error("접속 코드가 필요합니다.");
      try { localStorage.setItem(CODEKEY, c); } catch(e) {}
      return scanCall(dataUrl, true);
    }
    return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || ("오류 " + r.status)); return j; });
  });
}
function showScan(j){
  var rows = (j.rows || []).filter(function(x){ return x && x.name && NAMES[ek(x.name)]; });
  var bad = (j.rows || []).filter(function(x){ return !x || !x.name || !NAMES[ek(x.name)]; });
  var sum = {}; KINDS.forEach(function(k){ sum[k] = 0; });
  var li = rows.map(function(x){
    var parts = []; KINDS.forEach(function(k){ var n = +x[k] || 0; if (n) { parts.push(k + " " + n); sum[k] += n; } });
    var am = Math.round(+x["금액"] || 0); if (am > 0) parts.push("결제 " + String(am).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "원");
    return '<li><span>'+esc(x.name)+'</span><b>'+(parts.join(" · ") || "-")+'</b></li>';
  });
  var h = '<h3>읽은 수량을 확인하세요</h3>';
  if (!rows.length) { ovlShow(h + '<p class="warn">읽은 수량이 없습니다. 표가 잘 보이게 다시 촬영해 주세요.</p>', false); return; }
  var warns = [];
  if (j.totals) ["일반","양많이","스페셜"].forEach(function(k){ var t = +j.totals[k]; if (t >= 0 && t !== sum[k]) warns.push(k + ": 표 합계 " + t + " ≠ 읽은 합계 " + sum[k]); });
  if (j.date) { var d = j.date.replace(/-/g, ""); if (d !== DAY) warns.push("표 날짜(" + j.date + ")가 오늘과 다릅니다."); }
  if (bad.length) warns.push("목록에 없는 행 " + bad.length + "개는 무시됩니다.");
  h += '<ul>' + li.join("") + '</ul>';
  h += '<p class="okm">합계 ' + KINDS.filter(function(k){ return sum[k]; }).map(function(k){ return k + " " + sum[k]; }).join(" · ") + '</p>';
  if (j.totals && !warns.some(function(w){ return w.indexOf("표 합계") >= 0; })) h += '<p class="okm">표 맨 아래 합계와 일치합니다 ✓</p>';
  warns.forEach(function(w){ h += '<p class="warn">⚠ ' + esc(w) + '</p>'; });
  h += '<p style="font-size:12.5px;color:var(--muted)">「적용」을 누르면 지금의 수량이 이 값으로 바뀝니다. (결제완료와 수거 표시는 그대로이고, 표에서 읽은 결제금액은 해당 업체에 입력됩니다)</p>';
  scanResult = rows; ovlShow(h, true);
}
function applyScan(){
  if (!scanResult) return;
  var next = {};
  Object.keys(counts).forEach(function(nm){ var c = counts[nm]; var o = {}; if (c._amt) o._amt = c._amt; if (c._pk) o._pk = c._pk; if (c._paid) o._paid = c._paid; if (Object.keys(o).length) next[nm] = o; });
  scanResult.forEach(function(x){
    KINDS.forEach(function(k){ var n = Math.round(+x[k] || 0); if (n > 0 && n <= 50) { next[x.name] = next[x.name] || {}; next[x.name][k] = n; } });
    var am = Math.round(+x["금액"] || 0); if (am > 0 && am < 100000000) { next[x.name] = next[x.name] || {}; next[x.name]._amt = am; }
  });
  counts = next; save(); refreshSelects(); renderSum(false);
  var enc = {}; Object.keys(counts).forEach(function(nm){ enc[ek(nm)] = counts[nm]; });
  fetch(BASE + "/counts.json", { method: "PUT", body: JSON.stringify(enc) }).catch(function(){ setSync(false, "저장 실패 · 연결을 확인하세요"); });
  ovlHide();
}
document.getElementById("scanBtn").addEventListener("click", function(){ document.getElementById("scanFile").click(); });
document.getElementById("scanFile").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!f) return;
  var btn = document.getElementById("scanBtn"); btn.disabled = true; btn.textContent = "사진을 읽는 중… (10~30초)";
  var done = function(){ btn.disabled = false; btn.textContent = "📷 배송표 촬영해서 수량 자동 입력"; };
  shrink(f, function(du){
    if (!du) { done(); ovlShow('<p class="warn">사진을 열 수 없습니다.</p>', false); return; }
    scanCall(du).then(function(j){ done(); showScan(j); }).catch(function(e){ done(); ovlShow('<h3>읽기 실패</h3><p class="warn">'+esc(e.message || e)+'</p>', false); });
  });
});
document.getElementById("ovlNo").addEventListener("click", ovlHide);
document.getElementById("ovlYes").addEventListener("click", applyScan);

render();
startSync();
</script>
