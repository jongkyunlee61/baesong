function setPath(path, data){

  if (!rows.length) { ovlShow(h + '<p class="warn">읽은 수량이 없습니다. 표가 잘 보이게 다시 촬영해 주세요.</p>', false); return; }
  var warns = [];
  if (j.totals) ["일반","양많이","스페셜","어린이"].forEach(function(k){ var t = +j.totals[k]; if (j.totals[k] != null && t >= 0 && t !== sum[k]) warns.push(k + ": 표 합계 " + t + " ≠ 읽은 합계 " + sum[k]); });
  if (j.date) { var d = j.date.replace(/-/g, ""); if (d !== DAY) warns.push("표 날짜(" + j.date + ")가 오늘과 다릅니다."); }
  if (bad.length) warns.push("목록에 없는 행 " + bad.length + "개는 무시됩니다.");
  h += '<ul>' + li.join("") + '</ul>';
  h += '<p class="okm">합계 ' + ALLK.filter(function(k){ return sum[k]; }).map(function(k){ return k + " " + sum[k]; }).join(" · ") + '</p>';
  if (j.totals && !warns.some(function(w){ return w.indexOf("표 합계") >= 0; })) h += '<p class="okm">표 맨 아래 합계와 일치합니다 ✓</p>';
  warns.forEach(function(w){ h += '<p class="warn">⚠ ' + esc(w) + '</p>'; });
  h += '<p style="font-size:12.5px;color:var(--muted)">「적용」을 누르면 지금의 수량이 이 값으로 바뀝니다. (결제완료와 수거 표시는 그대로이고, 표에서 읽은 결제금액은 해당 업체에 입력됩니다)</p>';
  scanResult = rows; ovlShow(h, true);
}
function applyScan(){
  if (!scanResult) return;
  var next = {};
  var mine = {}; routeNames().forEach(function(k){ mine[k] = 1; });
  Object.keys(counts).forEach(function(nm){ if (!mine[nm]) { next[nm] = counts[nm]; return; } var c = counts[nm]; var o = {}; if (c._amt) o._amt = c._amt; if (c._pk) o._pk = c._pk; if (c._paid) o._paid = c._paid; if (c._dl) o._dl = c._dl; if (c._memo) o._memo = c._memo; EXTRA.forEach(function(k){ if (c[k]) o[k] = c[k]; }); if (Object.keys(o).length) next[nm] = o; });
  scanResult.forEach(function(x){
    ALLK.forEach(function(k){ var n = Math.round(+x[k] || 0); if (n > 0 && n <= 50) { var kx = K(x.name); next[kx] = next[kx] || {}; next[kx][k] = n; } });
    var am = Math.round(+x["금액"] || 0); if (am > 0 && am < 100000000) { var ka = K(x.name); next[ka] = next[ka] || {}; next[ka]._amt = am; }
  });
  counts = next; save(); refreshSelects(); renderSum(false);
  var enc = {}; Object.keys(counts).forEach(function(nm){ enc[ek(nm)] = counts[nm]; });
  fetch(BASE + "/counts.json", { method: "PUT", body: JSON.stringify(enc) }).catch(function(){ setSync(false, "저장 실패 · 연결을 확인하세요"); });
  ovlHide();
}
document.getElementById("scanBtn").addEventListener("click", function(){ document.getElementById("scanFile").click(); });
document.getElementById("scanAlbum").addEventListener("click", function(){ document.getElementById("scanFileAlbum").click(); });
function onPick(ev){
  var f = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!f) return;
  var b1 = document.getElementById("scanBtn"), b2 = document.getElementById("scanAlbum");
  b1.disabled = b2.disabled = true; b1.textContent = "읽는 중… (10~30초)";
  var done = function(){ b1.disabled = b2.disabled = false; b1.textContent = "📷 카메라로 촬영"; };
  shrink(f, function(du){
    if (!du) { done(); ovlShow('<p class="warn">사진을 열 수 없습니다.</p>', false); return; }
    scanCall(du).then(function(j){ done(); showScan(j); }).catch(function(e){ done(); ovlShow('<h3>읽기 실패</h3><p class="warn">'+esc(e.message || e)+'</p>', false); });
  });
}
document.getElementById("scanFile").addEventListener("change", onPick);
document.getElementById("scanFileAlbum").addEventListener("change", onPick);
document.getElementById("ovlNo").addEventListener("click", ovlHide);
document.getElementById("ovlYes").addEventListener("click", applyScan);

function paintRoute(){
  fillQ();
  var h = "";
  ROUTES.forEach(function(r){ h += '<button type="button" role="tab" data-route="'+r.id+'" class="'+(r.id===ROUTE?'on':'')+'" aria-selected="'+(r.id===ROUTE?'true':'false')+'"><span>루트 '+r.id+'</span><span>'+r.name+'</span></button>'; });
  document.getElementById("tabs").innerHTML = h;
  document.querySelector("h1").className = "r" + ROUTE;
  var sp = document.querySelector("h1 span"); if (sp) sp.textContent = "푸드홀릭 배송[" + routeName() + "]";
  document.title = "푸드홀릭 배송[" + routeName() + "]";
}
document.getElementById("tabs").addEventListener("click", function(ev){
  var b = ev.target.closest("button[data-route]"); if (!b) return;
  ROUTE = +b.getAttribute("data-route"); try { localStorage.setItem(ROUTEKEY, String(ROUTE)); } catch(e) {}
  paintRoute(); render(); window.scrollTo(0, 0);
});

/* ---- 지난 기록 (날짜별 수량·결제금액 조회) ---- */
var histEl = document.getElementById("hist"), histBody = document.getElementById("histBody"), histBack = document.getElementById("histBack");
function dFmt(k){ var w = ["일","월","화","수","목","금","토"][new Date(+k.slice(0,4), +k.slice(4,6)-1, +k.slice(6,8)).getDay()]; return k.slice(0,4)+"."+k.slice(4,6)+"."+k.slice(6,8)+" ("+w+")"; }
function won(n){ return Number(n||0).toLocaleString("ko-KR")+"원"; }
function histList(){
  histBack.hidden = true; histBody.innerHTML = "<h3>지난 기록</h3><p>불러오는 중…</p>";
  fetch(DB + "/baesong.json?shallow=true").then(function(r){ return r.json(); }).then(function(o){
    var days = Object.keys(o || {}).filter(function(k){ return /^\d{8}$/.test(k); }).sort().reverse();
    if (!days.length) { histBody.innerHTML = "<h3>지난 기록</h3><p>저장된 기록이 아직 없습니다.</p>"; return; }
    histBody.innerHTML = "<h3>지난 기록</h3>" + days.map(function(k){ return '<button type="button" class="hd" data-day="'+k+'"><span>'+dFmt(k)+(k===DAY?' · 오늘':'')+'</span><b>›</b></button>'; }).join("");
  }).catch(function(){ histBody.innerHTML = "<h3>지난 기록</h3><p>불러오지 못했습니다. 인터넷 연결을 확인하세요.</p>"; });
}
function histDay(k){
  histBack.hidden = false; histBody.innerHTML = "<h3>"+dFmt(k)+"</h3><p>불러오는 중…</p>";
  fetch(DB + "/baesong/" + k + "/counts.json").then(function(r){ return r.json(); }).then(function(c){
    c = c || {};
    var html = "<h3>"+dFmt(k)+"</h3>";
    ROUTES.forEach(function(rt){
      var tot = {}, amt = 0, paid = 0, rows = "", n = 0;
      DATA.filter(function(d){ return inRoute(d, rt.id); }).sort(function(a, b){
        var x = rnum(a, rt.id), y = rnum(b, rt.id);
        return (x == null ? 999 : x) - (y == null ? 999 : y);
      }).forEach(function(d){
        var v = c[ek(K(d.n, rt.id))]; if (!v) return;
        var q = [], has = false;
        ALLK.forEach(function(kd){ var x = +v[kd] || 0; if (x) { has = true; q.push(KL(kd, rt.id)+" "+x); tot[kd] = (tot[kd]||0) + x; } });
        var a = +v._amt || 0; if (a) { has = true; amt += a; if (v._paid) paid += a; }
        if (!has && !v._pk && !v._dl && !v._memo) return;
        n++;
        var st = []; if (v._dl) st.push("배송완료"); if (v._paid) st.push("결제완료"); if (v._pk === 1) st.push("수거완료"); if (v._pk === 2) st.push("미수거");
        rows += "<li><span>"+esc(d.n)+"<small>"+(q.join(" · ")||"수량 없음")+(st.length?" · "+st.join(" · "):"")+(v._memo?"<br>미결재/비고: "+esc(v._memo):"")+"</small></span><b>"+(a?won(a):"")+"</b></li>";
      });
      var ts = ALLK.filter(function(kd){ return tot[kd]; }).map(function(kd){ return KL(kd, rt.id)+" "+tot[kd]; }).join(" · ") || "수량 없음";
      html += "<h3 style='margin-top:16px'>루트 "+rt.id+" · "+esc(rt.name)+"</h3><div class='okm'>"+n+"곳 · "+esc(ts)+"</div><div class='okm'>결제금액 합계 "+won(amt)+" (결제완료 "+won(paid)+")</div><ul>"+(rows||"<li>입력된 내용이 없습니다.</li>")+"</ul>";
    });
    histBody.innerHTML = html;
  }).catch(function(){ histBody.innerHTML = "<h3>"+dFmt(k)+"</h3><p>불러오지 못했습니다.</p>"; });
}
document.getElementById("histBtn").addEventListener("click", function(){ histEl.hidden = false; histList(); });
document.getElementById("histClose").addEventListener("click", function(){ histEl.hidden = true; });
histBack.addEventListener("click", histList);
histEl.addEventListener("click", function(ev){ if (ev.target === histEl) histEl.hidden = true; var b = ev.target.closest("button[data-day]"); if (b) histDay(b.getAttribute("data-day")); });
paintRoute();
render();
startSync();
</script>
</body></html>
